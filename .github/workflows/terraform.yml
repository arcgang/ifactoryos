name: terraform
on:
  pull_request:
  push:
    branches: [main]
jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: platform
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false
      - run: terraform validate

  openapi-validate:
    runs-on: ubuntu-latest
    name: Validate OpenAPI 3.1 contracts
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java (required by openapi-generator-cli)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Install openapi-generator-cli
        run: |
          npm install -g @openapitools/openapi-generator-cli
      - name: Validate all OpenAPI specs
        run: |
          failed=0
          for spec in platform/api-gateway/contracts/openapi/*.yaml; do
            echo "Validating $spec ..."
            openapi-generator-cli validate -i "$spec" || failed=1
          done
          exit $failed
      - name: Generate Python client stub (smoke test)
        run: |
          failed=0
          for spec in platform/api-gateway/contracts/openapi/*.yaml; do
            name=$(basename "$spec" .yaml)
            echo "Generating Python stub for $spec ..."
            openapi-generator-cli generate \
              -i "$spec" \
              -g python \
              -o "/tmp/generated-python/$name" \
              --package-name ifactoryos_client \
              --skip-validate-spec false \
              2>&1 | tail -5 || failed=1
          done
          exit $failed
