# Generated from the repository plan: local stand-ins for the platform components.
name: local
services:
  kafka:
    image: bitnami/kafka:3.7
    ports:
      - ${KAFKA_PORT:-9092}:9092
    environment:
      KAFKA_CFG_NODE_ID: "0"
      KAFKA_CFG_PROCESS_ROLES: controller,broker
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 0@kafka:9093
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: "true"
    restart: unless-stopped
  schema-registry:
    image: confluentinc/cp-schema-registry:7.6.1
    ports:
      - ${SCHEMA_REGISTRY_PORT:-8085}:8081
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: PLAINTEXT://kafka:9092
    depends_on:
      - kafka
    restart: unless-stopped
  mqtt:
    image: eclipse-mosquitto:2
    ports:
      - ${MQTT_PORT:-1883}:1883
    command:
      - mosquitto
      - -c
      - /mosquitto-no-auth.conf
    restart: unless-stopped
  neo4j:
    image: neo4j:5
    ports:
      - ${NEO4J_HTTP_PORT:-7474}:7474
      - ${NEO4J_BOLT_PORT:-7687}:7687
    environment:
      NEO4J_AUTH: neo4j/localpassword
    restart: unless-stopped
  oidc:
    image: ghcr.io/navikt/mock-oauth2-server:2.1.10
    ports:
      - ${OIDC_PORT:-8090}:8080
    restart: unless-stopped
  vault:
    image: hashicorp/vault:1.17
    ports:
      - ${VAULT_PORT:-8200}:8200
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: local-root
    command:
      - server
      - -dev
      - -dev-listen-address=0.0.0.0:8200
    restart: unless-stopped
  azurite:
    image: mcr.microsoft.com/azure-storage/azurite
    ports:
      - ${AZURITE_PORT:-10000}:10000
    command:
      - azurite-blob
      - --blobHost
      - 0.0.0.0
    restart: unless-stopped
  otel-lgtm:
    image: grafana/otel-lgtm:latest
    ports:
      - ${GRAFANA_PORT:-3001}:3000
      - ${OTLP_PORT:-4318}:4318
    restart: unless-stopped
  citus:
    image: citusdata/citus:12.1
    ports:
      - ${CITUS_PORT:-5434}:5432
    environment:
      POSTGRES_PASSWORD: local
      POSTGRES_DB: app
    restart: unless-stopped
