openapi: 3.1.0
info:
  title: Adoption Instrumentation API
  version: 1.0.0
  description: >
    Telemetry ingestion for console adoption events — AR session starts, expert calls,
    handover submissions, torque logs. Feeds the platform-wide adoption dashboard.
    Station-level only; no operator-identifiable data (GDPR/BetrVG).
    Data residency: Azure Germany West Central (EU).
  contact:
    name: iFactoryOS Platform Team
servers:
  - url: https://api.ifactoryos.bmw.de/v1/instrumentation
    description: Production (Germany West Central)
  - url: https://api-dev.ifactoryos.bmw.de/v1/instrumentation
    description: Development

security:
  - BearerAuth: []

x-rate-limit:
  default: "600/minute per client"

paths:
  /event:
    post:
      operationId: submitAdoptionEvent
      summary: Submit an adoption instrumentation event
      description: >
        Accepts a single adoption event. Station-level only — no operator-identifiable
        data stored. Events are forwarded to bmw.ifos.munich.line-command.adoption.v1
        Kafka topic.
      x-rate-limit: "600/minute per client"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdoptionEventRequest"
      responses:
        "202":
          description: Event accepted for processing
          headers:
            Deprecation:
              $ref: "#/components/headers/Deprecation"
            Sunset:
              $ref: "#/components/headers/Sunset"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdoptionEventAccepted"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: BMW Entra ID OAuth 2.0 JWT.

  headers:
    Deprecation:
      description: RFC 8594 Deprecation header. Present when this API version is deprecated.
      schema:
        type: string
    Sunset:
      description: RFC 8594 Sunset header. Present when this API version is deprecated.
      schema:
        type: string

  responses:
    BadRequest:
      description: Invalid event payload
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Unauthorized:
      description: Missing or invalid bearer token
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    UnprocessableEntity:
      description: Unknown event type or missing required fields
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"

  schemas:
    Problem:
      type: object
      required:
        - type
        - title
        - status
        - correlation_id
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        correlation_id:
          type: string
          format: uuid
        instance:
          type: string
          format: uri

    AdoptionEventRequest:
      type: object
      required:
        - eventType
        - stationId
        - lineId
        - occurredAt
        - consoleApp
      properties:
        eventType:
          type: string
          enum:
            - AR_SESSION_STARTED
            - AR_SESSION_ENDED
            - EXPERT_CALL_STARTED
            - EXPERT_CALL_ENDED
            - HANDOVER_SUBMITTED
            - TORQUE_LOG_SUBMITTED
            - SEQUENCE_OVERRIDE_APPLIED
            - SHIFT_STARTED
            - SHIFT_ENDED
          description: >
            Station-level adoption event type. No operator-identifiable data;
            personal-data fields (e.g. userId) are prohibited.
        stationId:
          type: string
          description: Station identifier — station-level, not operator-level
        lineId:
          type: string
        occurredAt:
          type: string
          format: date-time
        consoleApp:
          type: string
          enum:
            - line-command
            - planning-cockpit
            - quality-studio
        sessionId:
          type: string
          format: uuid
          description: Optional client-side session correlation ID
        durationMs:
          type: integer
          description: Duration of the action in ms (where applicable)
        metadata:
          type: object
          additionalProperties:
            type: string
          description: >
            Arbitrary key-value metadata. Values must not contain PII.
            Maximum 20 keys, values ≤ 256 chars each.
          maxProperties: 20

    AdoptionEventAccepted:
      type: object
      required:
        - eventId
        - acceptedAt
      properties:
        eventId:
          type: string
          format: uuid
        acceptedAt:
          type: string
          format: date-time
