openapi: 3.1.0
info:
  title: Defect Genome API
  version: 1.0.0
  description: >
    DBSCAN / XGBoost defect clustering and root-cause classification via KServe.
    Results feed the quality-studio defect heatmap and corrective-action queue.
    Data residency: Azure Germany West Central (EU).
  contact:
    name: iFactoryOS Platform Team
servers:
  - url: https://api.ifactoryos.bmw.de/v1/defects
    description: Production (Germany West Central)
  - url: https://api-dev.ifactoryos.bmw.de/v1/defects
    description: Development

security:
  - BearerAuth: []

x-rate-limit:
  default: "60/minute per client"

paths:
  /cluster:
    post:
      operationId: clusterDefects
      summary: Submit defect records for DBSCAN clustering
      x-rate-limit: "10/minute per client"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClusterRequest"
      responses:
        "202":
          description: Clustering job accepted
          headers:
            Deprecation:
              $ref: "#/components/headers/Deprecation"
            Sunset:
              $ref: "#/components/headers/Sunset"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClusterJobAccepted"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
  /cluster/{id}:
    get:
      operationId: getClusterResult
      summary: Retrieve clustering result and corrective action suggestions
      x-rate-limit: "60/minute per client"
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Cluster job ID
      responses:
        "200":
          description: Clustering result
          headers:
            Deprecation:
              $ref: "#/components/headers/Deprecation"
            Sunset:
              $ref: "#/components/headers/Sunset"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClusterResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /alerts:
    get:
      operationId: listDefectAlerts
      summary: List active defect cluster alerts (cursor-paginated)
      x-rate-limit: "60/minute per client"
      parameters:
        - $ref: "#/components/parameters/cursor"
        - $ref: "#/components/parameters/limit"
        - name: status
          in: query
          schema:
            type: string
            enum:
              - active
              - acknowledged
              - resolved
              - all
            default: active
      responses:
        "200":
          description: Paginated defect alert list
          headers:
            Deprecation:
              $ref: "#/components/headers/Deprecation"
            Sunset:
              $ref: "#/components/headers/Sunset"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DefectAlertListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: BMW Entra ID OAuth 2.0 JWT.

  headers:
    Deprecation:
      description: RFC 8594 Deprecation header. Present when this API version is deprecated.
      schema:
        type: string
    Sunset:
      description: RFC 8594 Sunset header. Present when this API version is deprecated.
      schema:
        type: string

  parameters:
    cursor:
      name: cursor
      in: query
      required: false
      schema:
        type: string
    limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50

  responses:
    BadRequest:
      description: Invalid request payload
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Unauthorized:
      description: Missing or invalid bearer token
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Forbidden:
      description: Insufficient role
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    NotFound:
      description: Cluster not found
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    UnprocessableEntity:
      description: Semantic validation failure
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"

  schemas:
    Problem:
      type: object
      required:
        - type
        - title
        - status
        - correlation_id
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        correlation_id:
          type: string
          format: uuid
        instance:
          type: string
          format: uri

    CursorPage:
      type: object
      required:
        - next_cursor
        - limit
      properties:
        next_cursor:
          type:
            - string
            - "null"
        prev_cursor:
          type:
            - string
            - "null"
        limit:
          type: integer
          minimum: 1
          maximum: 200

    ClusterRequest:
      type: object
      required:
        - defects
        - shiftId
      properties:
        shiftId:
          type: string
          format: uuid
        defects:
          type: array
          minItems: 1
          maxItems: 10000
          items:
            $ref: "#/components/schemas/DefectRecord"
        idempotencyKey:
          type: string
          format: uuid

    DefectRecord:
      type: object
      required:
        - defectId
        - vin
        - stationCode
        - defectCode
        - detectedAt
      properties:
        defectId:
          type: string
          format: uuid
        vin:
          type: string
          pattern: '^[A-HJ-NPR-Z0-9]{17}$'
        stationCode:
          type: string
        defectCode:
          type: string
        severity:
          type: string
          enum:
            - minor
            - major
            - critical
        detectedAt:
          type: string
          format: date-time
        measurementValues:
          type: object
          additionalProperties:
            type: number

    ClusterJobAccepted:
      type: object
      required:
        - jobId
        - acceptedAt
        - estimatedCompletionAt
      properties:
        jobId:
          type: string
          format: uuid
        acceptedAt:
          type: string
          format: date-time
        estimatedCompletionAt:
          type: string
          format: date-time

    ClusterResult:
      type: object
      required:
        - jobId
        - status
        - clusters
        - completedAt
      properties:
        jobId:
          type: string
          format: uuid
        status:
          type: string
          enum:
            - pending
            - running
            - completed
            - failed
        clusters:
          type: array
          items:
            $ref: "#/components/schemas/DefectCluster"
        completedAt:
          type:
            - string
            - "null"
          format: date-time

    DefectCluster:
      type: object
      required:
        - clusterId
        - defectCount
        - representativeDefectCode
        - affectedVins
        - rootCauseHypothesis
        - confidenceScore
      properties:
        clusterId:
          type: string
          format: uuid
        defectCount:
          type: integer
        representativeDefectCode:
          type: string
        affectedVins:
          type: array
          items:
            type: string
        rootCauseHypothesis:
          type: string
        confidenceScore:
          type: number
          format: double
          minimum: 0
          maximum: 1
        suggestedCorrectiveAction:
          type: string

    DefectAlertListResponse:
      type: object
      required:
        - data
        - page
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/DefectClusterAlert"
        page:
          $ref: "#/components/schemas/CursorPage"

    DefectClusterAlert:
      type: object
      required:
        - alertId
        - clusterId
        - severity
        - defectCount
        - status
        - detectedAt
      properties:
        alertId:
          type: string
          format: uuid
        clusterId:
          type: string
          format: uuid
        severity:
          type: string
          enum:
            - minor
            - major
            - critical
        defectCount:
          type: integer
        status:
          type: string
          enum:
            - active
            - acknowledged
            - resolved
        detectedAt:
          type: string
          format: date-time
        acknowledgedAt:
          type:
            - string
            - "null"
          format: date-time
