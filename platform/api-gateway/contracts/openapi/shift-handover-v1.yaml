openapi: 3.1.0
info:
  title: Shift Handover API
  version: 1.0.0
  description: >
    Structured digital shift handover — links open Andon alert dispositions, OEE delta,
    and held VINs. Emits HANDOVER_SUBMITTED adoption event.
    Satisfies AC-e37bcf34, AC-5f4b73cb, AC-04cd3711, AC-fd1f00c6.
    Data residency: Azure Germany West Central (EU).
  contact:
    name: iFactoryOS Platform Team
servers:
  - url: https://api.ifactoryos.bmw.de/v1/handover
    description: Production (Germany West Central)
  - url: https://api-dev.ifactoryos.bmw.de/v1/handover
    description: Development

security:
  - BearerAuth: []

x-rate-limit:
  default: "60/minute per client"

paths:
  /handover:
    post:
      operationId: submitHandover
      tags:
        - Shift Handover
      summary: Submit a structured digital shift handover
      description: >
        Creates a shift handover record linking open Andon alert dispositions, OEE delta,
        and held VINs. Emits HANDOVER_SUBMITTED adoption event.
      x-rate-limit: "10/minute per client"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HandoverRequest"
      responses:
        "201":
          description: Handover submitted successfully
          headers:
            Deprecation:
              $ref: "#/components/headers/Deprecation"
            Sunset:
              $ref: "#/components/headers/Sunset"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HandoverResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
  /handover/{shift_id}:
    get:
      operationId: getHandover
      tags:
        - Shift Handover
      summary: Retrieve a specific shift handover record
      x-rate-limit: "60/minute per client"
      parameters:
        - name: shift_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: UUID of the shift
      responses:
        "200":
          description: Handover record
          headers:
            Deprecation:
              $ref: "#/components/headers/Deprecation"
            Sunset:
              $ref: "#/components/headers/Sunset"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HandoverRecord"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /handover/current:
    get:
      operationId: getCurrentHandover
      tags:
        - Shift Handover
      summary: Retrieve the in-progress handover for the active shift
      x-rate-limit: "60/minute per client"
      responses:
        "200":
          description: Current in-progress handover (may be a draft)
          headers:
            Deprecation:
              $ref: "#/components/headers/Deprecation"
            Sunset:
              $ref: "#/components/headers/Sunset"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HandoverRecord"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: BMW Entra ID OAuth 2.0 JWT. Requires shift-lead role for POST.

  headers:
    Deprecation:
      description: RFC 8594 Deprecation header. Present when this API version is deprecated.
      schema:
        type: string
    Sunset:
      description: RFC 8594 Sunset header. Present when this API version is deprecated.
      schema:
        type: string

  responses:
    BadRequest:
      description: Invalid handover payload
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Unauthorized:
      description: Unauthorised
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Forbidden:
      description: Caller does not have shift-lead role
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    NotFound:
      description: Resource not found
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Conflict:
      description: Handover already submitted for this shift (idempotency)
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"

  schemas:
    Problem:
      type: object
      required:
        - type
        - title
        - status
        - correlation_id
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        correlation_id:
          type: string
          format: uuid
        instance:
          type: string
          format: uri

    HandoverRequest:
      type: object
      required:
        - shiftId
        - lineId
        - shiftStartTs
        - shiftEndTs
        - alertDispositions
        - oeeDeltaPct
      properties:
        shiftId:
          type: string
          format: uuid
        lineId:
          type: string
        shiftStartTs:
          type: string
          format: date-time
        shiftEndTs:
          type: string
          format: date-time
        oeeDeltaPct:
          type: number
          format: double
          description: "OEE delta: current shift vs. 30-day average per weld line (positive = above average)"
        alertDispositions:
          type: array
          items:
            $ref: "#/components/schemas/AlertDispositionItem"
        heldVins:
          type: array
          items:
            type: string
            pattern: '^[A-HJ-NPR-Z0-9]{17}$'
          description: VINs flagged for quality review
        notes:
          type: string
          maxLength: 4000
        idempotencyKey:
          type: string
          format: uuid

    HandoverResponse:
      type: object
      required:
        - handoverId
        - submittedAt
        - submittedByUserId
      properties:
        handoverId:
          type: string
          format: uuid
        submittedAt:
          type: string
          format: date-time
        submittedByUserId:
          type: string

    HandoverRecord:
      type: object
      required:
        - handoverId
        - shiftId
        - lineId
        - shiftStartTs
        - shiftEndTs
        - oeeDeltaPct
        - alertDispositions
        - status
        - submittedAt
        - submittedByUserId
      properties:
        handoverId:
          type: string
          format: uuid
        shiftId:
          type: string
          format: uuid
        lineId:
          type: string
        shiftStartTs:
          type: string
          format: date-time
        shiftEndTs:
          type: string
          format: date-time
        oeeDeltaPct:
          type: number
          format: double
        alertDispositions:
          type: array
          items:
            $ref: "#/components/schemas/AlertDispositionItem"
        heldVins:
          type: array
          items:
            type: string
        notes:
          type:
            - string
            - "null"
        status:
          type: string
          enum:
            - draft
            - submitted
        submittedAt:
          type: string
          format: date-time
        submittedByUserId:
          type: string

    AlertDispositionItem:
      type: object
      required:
        - alertId
        - disposition
      properties:
        alertId:
          type: string
          format: uuid
        disposition:
          type: string
          enum:
            - resolved
            - escalated
            - monitoring
        note:
          type: string
          maxLength: 1000
