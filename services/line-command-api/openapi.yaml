openapi: 3.1.0
info:
  title: line-command-api
  version: "0.1.0"
  description: AR holographic work instruction overlay API for BMW iFactoryOS line-command.
servers:
  - url: /api/v1
paths:
  /oee/snapshots:
    get:
      tags:
        - OEE
      summary: List latest OEE snapshots for all weld lines
      operationId: listOeeSnapshots
      security:
        - BearerAuth: []
      parameters:
        - in: query
          name: cursor
          schema:
            type: string
        - in: query
          name: limit
          schema:
            type: integer
            default: 50
            maximum: 200
            minimum: 1
        - in: query
          name: lineId
          schema:
            type: string
        - in: query
          name: maxAgeSeconds
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: Paginated OEE snapshots
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OeeSnapshotListResponse"
        "401":
          description: Unauthorised
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /andon/alerts:
    get:
      tags:
        - Andon Alerts
      summary: List Andon alerts received from OpCenter
      operationId: listAndonAlerts
      security:
        - BearerAuth: []
      parameters:
        - in: query
          name: cursor
          schema:
            type: string
        - in: query
          name: limit
          schema:
            type: integer
            default: 50
            maximum: 200
            minimum: 1
        - in: query
          name: status
          schema:
            enum:
              - open
              - acknowledged
              - resolved
              - false_positive
            type: string
        - in: query
          name: lineId
          schema:
            type: string
        - in: query
          name: stationId
          schema:
            type: string
      responses:
        "200":
          description: Paginated Andon alerts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AndonAlertListResponse"
        "401":
          description: Unauthorised
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /andon/alerts/{alertId}:
    get:
      tags:
        - Andon Alerts
      summary: Get a specific Andon alert by ID
      operationId: getAndonAlert
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: alertId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Andon alert detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AndonAlert"
        "401":
          description: Unauthorised
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Alert not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /andon/alerts/{alertId}/acknowledge:
    post:
      tags:
        - Andon Alerts
      summary: Acknowledge a predictive Andon alert and record disposition
      operationId: acknowledgeAndonAlert
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: alertId
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AlertAcknowledgeRequest"
      responses:
        "200":
          description: Alert acknowledged
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AlertAcknowledgeResponse"
        "400":
          description: Invalid disposition value
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Unauthorised
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Caller does not have shift-lead role
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Alert not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Alert already acknowledged
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /line-command/andon/alerts:
    get:
      tags:
        - Andon Alerts
      summary: List open predictive Andon alerts for the current shift (paginated)
      operationId: listLineCommandAndonAlerts
      security:
        - BearerAuth: []
      parameters:
        - in: query
          name: shiftId
          schema:
            type: string
            format: uuid
        - in: query
          name: status
          schema:
            enum:
              - open
              - resolved
              - escalated
              - monitoring
            type: string
        - in: query
          name: lineId
          schema:
            type: string
        - in: query
          name: cursor
          schema:
            type: string
        - in: query
          name: limit
          schema:
            type: integer
            default: 50
            maximum: 200
            minimum: 1
      responses:
        "200":
          description: Paginated list of Andon alerts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AndonAlertListResponse"
        "400":
          description: Invalid query parameters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Unauthorised
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/handovers:
    get:
      tags:
        - Handovers
      summary: List recent shift handovers for Command Center
      operationId: listHandovers
      security:
        - BearerAuth: []
      parameters:
        - in: query
          name: lineId
          schema:
            type: string
        - in: query
          name: cursor
          schema:
            type: string
        - in: query
          name: limit
          schema:
            type: integer
            default: 20
            maximum: 200
            minimum: 1
      responses:
        "200":
          description: Paginated shift handovers
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShiftHandoverListResponse"
        "400":
          description: Invalid query parameters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Unauthorised
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /ar/instructions/{vin}:
    get:
      tags:
        - AR Instructions
      summary: Retrieve VIN-specific AR holographic work instruction overlay
      operationId: getArInstructions
      description: >
        Returns the full work instruction payload for the given VIN including
        option codes, torque specifications, step sequence, variant delta
        indicators, and a fallback PDF QR code URL. Must respond within 5 s
        at p95 to satisfy AC-00bc6b07.
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: vin
          required: true
          description: 17-character Vehicle Identification Number
          schema:
            type: string
            pattern: ^[A-HJ-NPR-Z0-9]{17}$
        - in: query
          name: stationId
          required: true
          description: "Station identifier (e.g. MARRIAGE-01, FINAL-02)"
          schema:
            type: string
        - in: query
          name: deviceType
          required: true
          description: AR device type for overlay rendering
          schema:
            type: string
            enum:
              - HoloLens2
              - iPad
      responses:
        "200":
          description: VIN-specific AR instruction overlay
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArInstructionResponse"
        "400":
          description: Invalid VIN or missing required query parameters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Missing or invalid bearer token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Caller does not have the assembly-associate or shift-lead role
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: VIN not found in digital thread
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "504":
          description: >
            Upstream digital thread or instruction store did not respond within
            timeout; fallback payload included
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArInstructionFallbackResponse"
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    CursorPage:
      type: object
      required:
        - next_cursor
        - limit
      properties:
        next_cursor:
          type:
            - string
            - "null"
          description: Opaque; null on the last page
        limit:
          type: integer
          minimum: 1
          maximum: 200
    OeeSnapshot:
      type: object
      required:
        - lineId
        - oeePercent
        - availability
        - performance
        - quality
        - measuredAt
        - dataAgeSeconds
        - stale
      properties:
        lineId:
          type: string
        oeePercent:
          type: number
          format: double
        availability:
          type: number
          format: double
        performance:
          type: number
          format: double
        quality:
          type: number
          format: double
        measuredAt:
          type: string
          format: date-time
        dataAgeSeconds:
          type: integer
        stale:
          type: boolean
          description: True when dataAgeSeconds > 30
    OeeSnapshotListResponse:
      type: object
      required:
        - data
        - page
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/OeeSnapshot"
        page:
          $ref: "#/components/schemas/CursorPage"
    AndonAlert:
      type: object
      required:
        - alertId
        - stationId
        - lineId
        - alertType
        - predictedFailureType
        - minutesToPredictedFailure
        - recommendedAction
        - status
        - detectedAt
      properties:
        alertId:
          type: string
          format: uuid
        stationId:
          type: string
        lineId:
          type: string
        alertType:
          type: string
          enum:
            - predictive
            - reactive
        predictedFailureType:
          type: string
        minutesToPredictedFailure:
          type:
            - integer
            - "null"
        recommendedAction:
          type: string
        status:
          type: string
          enum:
            - open
            - acknowledged
            - resolved
            - false_positive
        detectedAt:
          type: string
          format: date-time
        resolvedAt:
          type:
            - string
            - "null"
          format: date-time
        acknowledgedAt:
          type:
            - string
            - "null"
          format: date-time
        opcenterEventId:
          type:
            - string
            - "null"
    AndonAlertListResponse:
      type: object
      required:
        - data
        - page
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/AndonAlert"
        page:
          $ref: "#/components/schemas/CursorPage"
    AlertAcknowledgeRequest:
      type: object
      required:
        - disposition
      properties:
        disposition:
          type: string
          enum:
            - resolved
            - escalated
            - monitoring
        note:
          type: string
          maxLength: 1000
    AlertAcknowledgeResponse:
      type: object
      required:
        - alertId
        - status
        - acknowledgedAt
        - eventId
      properties:
        alertId:
          type: string
          format: uuid
        status:
          type: string
        acknowledgedAt:
          type: string
          format: date-time
        eventId:
          type: string
          format: uuid
    ShiftHandoverListResponse:
      type: object
      required:
        - data
        - page
      properties:
        data:
          type: array
          items:
            type: object
        page:
          $ref: "#/components/schemas/CursorPage"
    ArInstructionStep:
      type: object
      required:
        - stepNumber
        - description
        - torqueSpecNm
        - torqueToleranceNm
        - fastenerPointId
      properties:
        stepNumber:
          type: integer
        description:
          type: string
        torqueSpecNm:
          type: number
          format: double
        torqueToleranceNm:
          type: number
          format: double
        fastenerPointId:
          type: string
        isVariantDelta:
          type: boolean
          description: True if this step differs from standard i4 configuration
        variantDeltaNote:
          type: string
          description: Human-readable description of what differs for this variant
        holographicAssetUrl:
          type: string
          format: uri
    ArInstructionResponse:
      type: object
      required:
        - vin
        - stationId
        - optionCodes
        - variantCode
        - isRareVariant
        - steps
        - instructionVersion
        - fetchedAt
      properties:
        vin:
          type: string
        stationId:
          type: string
        optionCodes:
          type: array
          items:
            type: string
        variantCode:
          type: string
        isRareVariant:
          type: boolean
        steps:
          type: array
          items:
            $ref: "#/components/schemas/ArInstructionStep"
        instructionVersion:
          type: string
        fetchedAt:
          type: string
          format: date-time
        fallbackPdfQrUrl:
          type: string
          format: uri
          description: QR code URL for fallback PDF; always populated
    ArInstructionFallbackResponse:
      type: object
      required:
        - vin
        - stationId
        - fallbackPdfQrUrl
        - failureLoggedAt
        - correlationId
      properties:
        vin:
          type: string
        stationId:
          type: string
        fallbackPdfQrUrl:
          type: string
          format: uri
        failureLoggedAt:
          type: string
          format: date-time
        correlationId:
          type: string
          format: uuid
    Error:
      type: object
      required:
        - code
        - message
        - correlation_id
      properties:
        code:
          type: string
          description: Stable machine-readable error code
        message:
          type: string
        correlation_id:
          type: string
          format: uuid
        details:
          type: array
          items:
            type: object
            additionalProperties: true
