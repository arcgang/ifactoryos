[package]
name = "opcenter-sync-service"
version = "0.1.0"
edition = "2021"

[lib]
name = "opcenter_sync_service"
path = "src/lib.rs"

[[bin]]
name = "opcenter-sync-service"
path = "src/main.rs"

[features]
# Expose test helpers (stub routers, in-process fakes) for integration tests.
test-helpers = []

[dependencies]
axum = { version = "0.7", features = ["macros"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
sqlx = { version = "0.8", features = ["postgres", "runtime-tokio-rustls", "uuid", "chrono"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
dotenvy = "0.15"

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
tower = { version = "0.4", features = ["util"] }

# Run integration tests with the test-helpers feature enabled.
[[test]]
name = "andon_alerts_test"
required-features = ["test-helpers"]

[[test]]
name = "gate_results_test"
required-features = ["test-helpers"]
